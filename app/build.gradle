plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'br.com.lume35.camera'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'br.com.lume35.camera'
        minSdk 29
        targetSdk 35
        versionCode 11
        versionName '1.6.1'
    }

    signingConfigs {
        release {
            def path = providers.environmentVariable('LUME_SIGNING_FILE').orNull
            storeFile path ? file(path) : new File(System.getProperty('user.home'), '.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
    implementation 'androidx.exifinterface:exifinterface:1.3.2'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
}
