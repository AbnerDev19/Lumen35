name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Restaurar chave de teste opcional
        env:
          LUME_DEBUG_KEY_BASE64: ${{ secrets.LUME_DEBUG_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$LUME_DEBUG_KEY_BASE64" ]; then
            printf %s "$LUME_DEBUG_KEY_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          elif [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Compilar e verificar
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:assembleRelease

      - name: Verificar assinatura e preparar APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Lume35.apk
          cp app/build/outputs/apk/release/app-release.apk Lume35-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Lume35.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Lume35-release.apk

      - uses: actions/upload-artifact@v6
        with:
          name: Lume35-APK
          path: Lume35.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: Lume35-release-APK
          path: Lume35-release.apk
          if-no-files-found: error
